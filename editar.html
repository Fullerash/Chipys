<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chippys Admin - Gestión de Menú</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1013;
      --panel: #17181d;
      --card: #1f2026;
      --card-inner: #272931;
      --accent-yellow: #ffb703;
      --accent-orange: #fb8500;
      --text: #f8f9fa;
      --muted: #9499a8;
      --dim: #5c6170;
      --border: #2d3039;
      --red: #e63946;
      --green: #25d366;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); padding-bottom: 90px; }

    /* Modal de Login */
    .login-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 16, 19, 0.98);
      backdrop-filter: blur(16px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-top: 3px solid var(--accent-yellow);
      border-radius: 16px;
      padding: 30px 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    .login-title { font-family: 'Montserrat', sans-serif; font-size: 1.5rem; font-weight: 900; color: var(--accent-yellow); margin-bottom: 6px; }
    .login-desc { font-size: 0.8rem; color: var(--muted); margin-bottom: 20px; }
    .pin-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-size: 1.3rem;
      text-align: center;
      letter-spacing: 5px;
      margin-bottom: 14px;
    }
    .pin-input:focus { outline: none; border-color: var(--accent-yellow); }
    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-yellow) 0%, var(--accent-orange) 100%);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .btn-login:active { opacity: 0.9; }

    /* Topbar fija */
    header {
      background: rgba(23, 24, 29, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 22px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }
    .brand-group { display: flex; align-items: center; gap: 12px; }
    .brand-title { font-family: 'Montserrat', sans-serif; font-size: 1.35rem; font-weight: 900; color: var(--accent-yellow); letter-spacing: 1px; }
    .status-pill { background: rgba(37, 211, 102, 0.12); color: var(--green); border: 1px solid rgba(37, 211, 102, 0.25); font-size: 0.72rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; }

    .btn-save {
      background: linear-gradient(135deg, var(--green) 0%, #1eaa4e 100%);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.25);
      transition: opacity 0.15s, transform 0.15s;
    }
    .btn-save:hover { opacity: 0.95; }
    .btn-save:active { transform: scale(0.98); }

    /* Barra de control: Buscador y Filtros */
    .controls-bar {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .search-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
    }
    .search-input:focus { outline: none; border-color: var(--accent-yellow); }

    .cat-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .cat-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab-btn.active, .tab-btn:hover {
      background: var(--accent-yellow);
      color: #000;
      border-color: var(--accent-yellow);
    }

    /* Contenedor principal */
    .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }

    /* Categoría */
    .cat-block {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 25px;
      overflow: hidden;
    }
    .cat-header {
      background: rgba(255, 183, 3, 0.05);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cat-label {
      font-family: 'Montserrat';
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--accent-yellow);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cat-badge {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 12px;
    }

    /* Tarjetas de Producto */
    .prod-card {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .prod-card:last-child { border-bottom: none; }

    .grid-row-1 {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }
    .price-input-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
    }
    .price-input-wrap span { color: var(--accent-yellow); font-weight: 700; font-size: 0.9rem; }
    .price-input-wrap input {
      background: transparent;
      border: none;
      color: #fff;
      font-weight: 700;
      font-size: 0.9rem;
      width: 80px;
    }
    .price-input-wrap input:focus { outline: none; }

    .input-clean {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      width: 100%;
    }
    .input-clean:focus { outline: none; border-color: var(--accent-yellow); }

    /* Variantes / Tamaños */
    .variant-box {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
    }
    .variant-row {
      display: grid;
      grid-template-columns: 1fr 100px 32px;
      gap: 8px;
      margin-bottom: 6px;
      align-items: center;
    }

    .btn-sub {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-sub:hover { color: #fff; border-color: var(--muted); }
    .btn-del { color: var(--red); border-color: rgba(230,57,70,0.3); background: rgba(230,57,70,0.1); width: 32px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; }

    .btn-add-prod {
      width: 100%;
      background: transparent;
      border: 1px dashed var(--accent-yellow);
      color: var(--accent-yellow);
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      margin: 12px 0 6px;
      transition: background 0.15s;
    }
    .btn-add-prod:hover { background: rgba(255, 183, 3, 0.08); }

    /* Toast */
    .toast-msg {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: var(--green);
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.88rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      display: none;
      z-index: 200;
    }
  </style>
</head>
<body>

  <!-- Modal de PIN / Password -->
  <div class="login-overlay" id="login-modal">
    <div class="login-box">
      <div class="login-title">CHIPPYS</div>
      <div class="login-desc">Ingresa el PIN de administrador para acceder a la gestión</div>
      <form onsubmit="validarPIN(event)">
        <input type="password" id="admin-pin-field" class="pin-input" placeholder="••••" maxlength="8" autofocus>
        <button type="submit" class="btn-login">Entrar al Panel</button>
      </form>
    </div>
  </div>

  <header>
    <div class="brand-group">
      <div class="brand-title">CHIPPYS</div>
      <div class="status-pill">● Online</div>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="btn-save" onclick="guardarEnNpoint()">
        <span>🚀</span> Guardar y Publicar
      </button>
      <button class="btn-sub" onclick="cerrarSesion()" title="Cerrar sesión">Salir</button>
    </div>
  </header>

  <div class="controls-bar">
    <input type="text" id="search-box" class="search-input" placeholder="🔍 Buscar producto por nombre o ingrediente..." oninput="filtrarProductos()">
    <div class="cat-tabs" id="category-tabs"></div>
  </div>

  <main class="container" id="admin-container">
    <div style="text-align:center; padding: 50px; color: var(--muted);">Cargando catálogo interactivo...</div>
  </main>

  <div class="toast-msg" id="toast-msg">✅ ¡Cambios publicados y sincronizados con el menú!</div>

  <script>
    // ==========================================
    // CONFIGURACIÓN DE SEGURIDAD Y NPOINT
    // ==========================================
    const ADMIN_PIN = "231721"; // <-- PIN de acceso local
    const NPOINT_URL = "https://api.npoint.io/3b2ace171723868f5708";

    let menuData = [];
    let categoriaActiva = "todas";

    // Validar contraseña y sesión activa de forma segura
    function verificarSesion() {
      const estaAutenticado = sessionStorage.getItem('chippys_admin_auth') === 'true';
      const tienePin = Boolean(sessionStorage.getItem('chippys_admin_pin'));

      if (estaAutenticado && tienePin) {
        document.getElementById('login-modal').style.display = 'none';
        cargarDesdeNpoint();
      } else {
        sessionStorage.removeItem('chippys_admin_auth');
        sessionStorage.removeItem('chippys_admin_pin');
        document.getElementById('login-modal').style.display = 'flex';
      }
    }

    function validarPIN(e) {
      e.preventDefault();
      const input = document.getElementById('admin-pin-field').value;
      if (input === ADMIN_PIN) {
        sessionStorage.setItem('chippys_admin_auth', 'true');
        sessionStorage.setItem('chippys_admin_pin', input);
        document.getElementById('login-modal').style.display = 'none';
        cargarDesdeNpoint();
      } else {
        alert("PIN incorrecto");
        document.getElementById('admin-pin-field').value = '';
      }
    }

    function cerrarSesion() {
      sessionStorage.removeItem('chippys_admin_auth');
      sessionStorage.removeItem('chippys_admin_pin');
      location.reload();
    }

    async function cargarDesdeNpoint() {
      const container = document.getElementById('admin-container');
      try {
        const res = await fetch(NPOINT_URL);
        if (!res.ok) throw new Error("Error de conexión");
        menuData = await res.json();
        renderTabs();
        renderAdmin();
      } catch (err) {
        container.innerHTML = `
          <div style="background: rgba(230,57,70,0.15); border: 1px solid var(--red); padding: 20px; border-radius: 8px; text-align:center;">
            <b>Error al conectar con la base de datos:</b> Verifica tu conexión a internet o el enlace npoint.
          </div>
        `;
      }
    }

    function renderTabs() {
      const tabs = document.getElementById('category-tabs');
      tabs.innerHTML = `
        <button class="tab-btn ${categoriaActiva === 'todas' ? 'active' : ''}" onclick="cambiarFiltro('todas')">
          🌟 Ver Todos
        </button>
      `;

      menuData.forEach(cat => {
        tabs.innerHTML += `
          <button class="tab-btn ${categoriaActiva === cat.id ? 'active' : ''}" onclick="cambiarFiltro('${cat.id}')">
            ${cat.icono} ${cat.categoria}
          </button>
        `;
      });
    }

    function cambiarFiltro(catId) {
      categoriaActiva = catId;
      renderTabs();
      renderAdmin();
    }

    function filtrarProductos() {
      renderAdmin();
    }

    function renderAdmin() {
      const container = document.getElementById('admin-container');
      const busqueda = document.getElementById('search-box').value.toLowerCase().trim();
      container.innerHTML = '';

      let totalCoincidencias = 0;

      menuData.forEach((cat, cIdx) => {
        if (categoriaActiva !== 'todas' && cat.id !== categoriaActiva) return;

        let prodsHtml = '';
        let productosFiltrados = 0;

        cat.productos.forEach((p, pIdx) => {
          const coincideBusqueda = p.nombre.toLowerCase().includes(busqueda) || p.desc.toLowerCase().includes(busqueda);
          if (!coincideBusqueda) return;

          productosFiltrados++;
          totalCoincidencias++;

          let extraHtml = '';

          if (p.variantes) {
            extraHtml = `
              <div class="variant-box">
                <span style="font-size:0.72rem; color:var(--accent-yellow); font-weight:700; text-transform:uppercase; display:block; margin-bottom:6px;">
                  Tamaños / Porciones
                </span>
                ${p.variantes.map((v, vIdx) => `
                  <div class="variant-row">
                    <input type="text" class="input-clean" value="${v.tipo}" placeholder="Tamaño" oninput="menuData[${cIdx}].productos[${pIdx}].variantes[${vIdx}].tipo = this.value">
                    <div class="price-input-wrap">
                      <span>$</span>
                      <input type="number" value="${v.precio}" oninput="menuData[${cIdx}].productos[${pIdx}].variantes[${vIdx}].precio = Number(this.value)">
                    </div>
                    <button class="btn-sub btn-del" onclick="eliminarVariante(${cIdx}, ${pIdx}, ${vIdx})">✕</button>
                  </div>
                `).join('')}
                <button class="btn-sub" style="margin-top:4px;" onclick="agregarVariante(${cIdx}, ${pIdx})">+ Añadir Tamaño</button>
              </div>
            `;
          } else if (p.carnes) {
            extraHtml = `
              <div class="variant-box">
                <span style="font-size:0.72rem; color:var(--accent-yellow); font-weight:700; text-transform:uppercase; display:block; margin-bottom:6px;">
                  Precios según Carne
                </span>
                ${p.carnes.map((c, carIdx) => `
                  <div class="variant-row" style="grid-template-columns: 1fr 100px;">
                    <input type="text" class="input-clean" value="${c.tipo}" disabled style="opacity:0.65;">
                    <div class="price-input-wrap">
                      <span>$</span>
                      <input type="number" value="${c.precio}" oninput="menuData[${cIdx}].productos[${pIdx}].carnes[${carIdx}].precio = Number(this.value)">
                    </div>
                  </div>
                `).join('')}
              </div>
            `;
          }

          prodsHtml += `
            <div class="prod-card">
              <div class="grid-row-1">
                <input type="text" class="input-clean" style="font-weight:700;" value="${p.nombre}" placeholder="Nombre producto" oninput="menuData[${cIdx}].productos[${pIdx}].nombre = this.value">
                ${p.precio !== undefined ? `
                  <div class="price-input-wrap">
                    <span>$</span>
                    <input type="number" value="${p.precio}" oninput="menuData[${cIdx}].productos[${pIdx}].precio = Number(this.value)">
                  </div>
                ` : '<div style="font-size:0.75rem; color:var(--muted);">(Multi-precio)</div>'}
              </div>

              <textarea class="input-clean" style="resize:vertical; height:45px;" placeholder="Ingredientes / descripción" oninput="menuData[${cIdx}].productos[${pIdx}].desc = this.value">${p.desc}</textarea>
              
              <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
                <input type="text" class="input-clean" style="font-size:0.75rem; max-width:280px;" value="${p.img || ''}" placeholder="Foto (ej: img/producto.jpeg)" oninput="menuData[${cIdx}].productos[${pIdx}].img = this.value">
                <button class="btn-sub btn-del" style="width:auto; padding:5px 12px;" onclick="eliminarProducto(${cIdx}, ${pIdx})">Eliminar</button>
              </div>

              ${extraHtml}
            </div>
          `;
        });

        if (productosFiltrados > 0 || busqueda === '') {
          container.innerHTML += `
            <div class="cat-block">
              <div class="cat-header">
                <div class="cat-label">
                  <span>${cat.icono}</span>
                  <span>${cat.categoria}</span>
                </div>
                <div class="cat-badge">${cat.productos.length} ítems</div>
              </div>
              ${prodsHtml}
              <div style="padding: 10px 18px 16px;">
                <button class="btn-add-prod" onclick="agregarProducto(${cIdx})">+ Agregar nuevo producto a ${cat.categoria}</button>
              </div>
            </div>
          `;
        }
      });

      if (totalCoincidencias === 0 && busqueda !== '') {
        container.innerHTML = `<div style="text-align:center; padding: 40px; color:var(--muted);">No se encontraron productos para "${busqueda}".</div>`;
      }
    }

    function agregarVariante(cIdx, pIdx) {
      menuData[cIdx].productos[pIdx].variantes.push({ tipo: "Nuevo Tamaño", precio: 0 });
      renderAdmin();
    }

    function eliminarVariante(cIdx, pIdx, vIdx) {
      menuData[cIdx].productos[pIdx].variantes.splice(vIdx, 1);
      renderAdmin();
    }

    function agregarProducto(cIdx) {
      menuData[cIdx].productos.push({
        id: Date.now(),
        nombre: "Nuevo Ítem",
        desc: "Descripción / ingredientes...",
        precio: 5000,
        img: ""
      });
      renderAdmin();
    }

    function eliminarProducto(cIdx, pIdx) {
      if (confirm(`¿Eliminar ${menuData[cIdx].productos[pIdx].nombre}?`)) {
        menuData[cIdx].productos.splice(pIdx, 1);
        renderAdmin();
      }
    }

    async function guardarEnNpoint() {
      const btn = document.querySelector('.btn-save');
      const originalText = btn.innerHTML;
      btn.innerHTML = `<span>⏳</span> Guardando...`;
      btn.disabled = true;

      const pinSesion = sessionStorage.getItem('chippys_admin_pin') || '';

      try {
        const res = await fetch('/api/guardar', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            pin: pinSesion,
            menuData: menuData
          })
        });

        const resultado = await res.json();

        if (!res.ok) {
          throw new Error(resultado.error || 'Error al guardar');
        }

        const toast = document.getElementById('toast-msg');
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
      } catch (e) {
        console.error("Error al guardar:", e);
        alert(`No se pudo publicar el menú:\n${e.message}`);
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    verificarSesion();
  </script>
</body>
</html>
