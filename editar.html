<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chippys Admin - Gestión Profesional</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1013;
      --panel: #17181d;
      --card: #1f2026;
      --card-inner: #262832;
      --accent-yellow: #ffb703;
      --accent-orange: #fb8500;
      --text: #f8f9fa;
      --muted: #9499a8;
      --dim: #5c6170;
      --border: #2d3039;
      --red: #e63946;
      --green: #25d366;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); padding-bottom: 100px; }

    /* Modal Login */
    .login-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 16, 19, 0.98);
      backdrop-filter: blur(16px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-top: 3px solid var(--accent-yellow);
      border-radius: 16px;
      padding: 30px 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    .login-title { font-family: 'Montserrat', sans-serif; font-size: 1.5rem; font-weight: 900; color: var(--accent-yellow); margin-bottom: 6px; }
    .login-desc { font-size: 0.8rem; color: var(--muted); margin-bottom: 20px; }
    .pin-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-size: 1.3rem;
      text-align: center;
      letter-spacing: 5px;
      margin-bottom: 14px;
    }
    .pin-input:focus { outline: none; border-color: var(--accent-yellow); }
    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-yellow) 0%, var(--accent-orange) 100%);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
    }

    /* Topbar */
    header {
      background: rgba(23, 24, 29, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 22px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }
    .brand-group { display: flex; align-items: center; gap: 12px; }
    .brand-title { font-family: 'Montserrat', sans-serif; font-size: 1.35rem; font-weight: 900; color: var(--accent-yellow); letter-spacing: 1px; }
    .status-pill { background: rgba(37, 211, 102, 0.12); color: var(--green); border: 1px solid rgba(37, 211, 102, 0.25); font-size: 0.72rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; }

    .btn-save {
      background: linear-gradient(135deg, var(--green) 0%, #1eaa4e 100%);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.25);
      transition: opacity 0.15s, transform 0.15s;
    }
    .btn-save:hover { opacity: 0.95; }
    .btn-save:active { transform: scale(0.98); }

    /* Barra de control */
    .controls-bar {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .search-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
    }
    .search-input:focus { outline: none; border-color: var(--accent-yellow); }

    .cat-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .cat-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab-btn.active, .tab-btn:hover {
      background: var(--accent-yellow);
      color: #000;
      border-color: var(--accent-yellow);
    }

    /* Contenedor */
    .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }

    .cat-block {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 25px;
      overflow: hidden;
    }
    .cat-header {
      background: rgba(255, 183, 3, 0.05);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cat-label {
      font-family: 'Montserrat';
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--accent-yellow);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cat-badge {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 12px;
    }

    /* Cards */
    .prod-card {
      padding: 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .prod-card:last-child { border-bottom: none; }

    .grid-header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .price-input-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 9px;
    }
    .price-input-wrap span { color: var(--accent-yellow); font-weight: 700; font-size: 0.9rem; }
    .price-input-wrap input {
      background: transparent;
      border: none;
      color: #fff;
      font-weight: 700;
      font-size: 0.9rem;
      width: 85px;
    }
    .price-input-wrap input:focus { outline: none; }

    .input-clean {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      width: 100%;
    }
    .input-clean:focus { outline: none; border-color: var(--accent-yellow); }

    /* Variantes y Matriz Multiprecio */
    .variant-box {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }
    .variant-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .variant-title {
      font-size: 0.74rem;
      color: var(--accent-yellow);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .variant-row {
      display: grid;
      grid-template-columns: 1fr 115px 32px;
      gap: 8px;
      margin-bottom: 6px;
      align-items: center;
    }

    .btn-sub {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-sub:hover { color: #fff; border-color: var(--muted); }
    .btn-del { color: var(--red); border-color: rgba(230,57,70,0.3); background: rgba(230,57,70,0.1); width: 32px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; }

    .btn-add-prod {
      width: 100%;
      background: transparent;
      border: 1px dashed var(--accent-yellow);
      color: var(--accent-yellow);
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      margin: 12px 0 6px;
      transition: background 0.15s;
    }
    .btn-add-prod:hover { background: rgba(255, 183, 3, 0.08); }

    .type-switcher {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .type-switcher select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    /* Toast */
    .toast-msg {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: var(--green);
      color: #fff;
      padding: 14px 22px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.88rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      display: none;
      z-index: 200;
    }
  </style>
</head>
<body>

  <!-- Modal de PIN -->
  <div class="login-overlay" id="login-modal">
    <div class="login-box">
      <div class="login-title">CHIPPYS</div>
      <div class="login-desc">Ingresa el PIN de administrador para gestionar el menú</div>
      <form onsubmit="validarPIN(event)">
        <input type="password" id="admin-pin-field" class="pin-input" placeholder="••••" maxlength="8" autofocus>
        <button type="submit" class="btn-login">Entrar al Panel</button>
      </form>
    </div>
  </div>

  <header>
    <div class="brand-group">
      <div class="brand-title">CHIPPYS</div>
      <div class="status-pill">● Online</div>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="btn-save" onclick="guardarEnServidor()">
        <span>🚀</span> Guardar y Publicar
      </button>
      <button class="btn-sub" onclick="cerrarSesion()" title="Cerrar sesión">Salir</button>
    </div>
  </header>

  <div class="controls-bar">
    <input type="text" id="search-box" class="search-input" placeholder="🔍 Buscar producto por nombre o descripción..." oninput="filtrarProductos()">
    <div class="cat-tabs" id="category-tabs"></div>
  </div>

  <main class="container" id="admin-container">
    <div style="text-align:center; padding: 50px; color: var(--muted);">Cargando catálogo en vivo...</div>
  </main>

  <div class="toast-msg" id="toast-msg">✅ ¡Menú sincronizado y publicado al instante!</div>

  <script>
    const ADMIN_PIN = "231721";
    const NPOINT_URL = "https://api.npoint.io/3b2ace171723868f5708";

    let menuData = [];
    let categoriaActiva = "todas";

    function verificarSesion() {
      const estaAutenticado = sessionStorage.getItem('chippys_admin_auth') === 'true';
      const tienePin = Boolean(sessionStorage.getItem('chippys_admin_pin'));

      if (estaAutenticado && tienePin) {
        document.getElementById('login-modal').style.display = 'none';
        cargarDesdeNpoint();
      } else {
        sessionStorage.removeItem('chippys_admin_auth');
        sessionStorage.removeItem('chippys_admin_pin');
        document.getElementById('login-modal').style.display = 'flex';
      }
    }

    function validarPIN(e) {
      e.preventDefault();
      const input = document.getElementById('admin-pin-field').value;
      if (input === ADMIN_PIN) {
        sessionStorage.setItem('chippys_admin_auth', 'true');
        sessionStorage.setItem('chippys_admin_pin', input);
        document.getElementById('login-modal').style.display = 'none';
        cargarDesdeNpoint();
      } else {
        alert("PIN incorrecto");
        document.getElementById('admin-pin-field').value = '';
      }
    }

    function cerrarSesion() {
      sessionStorage.removeItem('chippys_admin_auth');
      sessionStorage.removeItem('chippys_admin_pin');
      location.reload();
    }

    async function cargarDesdeNpoint() {
      const container = document.getElementById('admin-container');
      try {
        const res = await fetch(`${NPOINT_URL}?t=${Date.now()}`);
        if (!res.ok) throw new Error("Error de conexión");
        menuData = await res.json();
        renderTabs();
        renderAdmin();
      } catch (err) {
        container.innerHTML = `
          <div style="background: rgba(230,57,70,0.15); border: 1px solid var(--red); padding: 20px; border-radius: 8px; text-align:center;">
            <b>Error de conexión:</b> No se pudo cargar la carta.
          </div>
        `;
      }
    }

    function renderTabs() {
      const tabs = document.getElementById('category-tabs');
      tabs.innerHTML = `
        <button class="tab-btn ${categoriaActiva === 'todas' ? 'active' : ''}" onclick="cambiarFiltro('todas')">
          🌟 Ver Todos
        </button>
      `;

      menuData.forEach(cat => {
        tabs.innerHTML += `
          <button class="tab-btn ${categoriaActiva === cat.id ? 'active' : ''}" onclick="cambiarFiltro('${cat.id}')">
            ${cat.icono} ${cat.categoria}
          </button>
        `;
      });
    }

    function cambiarFiltro(catId) {
      categoriaActiva = catId;
      renderTabs();
      renderAdmin();
    }

    function filtrarProductos() {
      renderAdmin();
    }

    function obtenerProducto(prodId) {
      for (const cat of menuData) {
        const p = cat.productos.find(item => item.id == prodId);
        if (p) return p;
      }
      return null;
    }

    function actualizarNombre(prodId, valor) {
      const p = obtenerProducto(prodId);
      if (p) p.nombre = valor;
    }

    function actualizarPrecio(prodId, valor) {
      const p = obtenerProducto(prodId);
      if (p) p.precio = Number(valor);
    }

    function actualizarDesc(prodId, valor) {
      const p = obtenerProducto(prodId);
      if (p) p.desc = valor;
    }

    function actualizarImg(prodId, valor) {
      const p = obtenerProducto(prodId);
      if (p) p.img = valor;
    }

    function actualizarVarianteTipo(prodId, vIdx, valor) {
      const p = obtenerProducto(prodId);
      if (p && p.variantes && p.variantes[vIdx]) p.variantes[vIdx].tipo = valor;
    }

    function actualizarVariantePrecio(prodId, vIdx, valor) {
      const p = obtenerProducto(prodId);
      if (p && p.variantes && p.variantes[vIdx]) p.variantes[vIdx].precio = Number(valor);
    }

    function actualizarCarne(prodId, cIdx, valor) {
      const p = obtenerProducto(prodId);
      if (p && p.carnes && p.carnes[cIdx]) {
        p.carnes[cIdx].precio = Number(valor);
      }
    }

    // Cambiar dinámicamente estructura entre precio fijo y multiprecio
    function cambiarEsquemaPrecio(prodId, nuevoEsquema) {
      const p = obtenerProducto(prodId);
      if (!p) return;

      if (nuevoEsquema === 'carnes') {
        delete p.precio;
        delete p.variantes;
        p.carnes = [
          { tipo: "Lomito", precio: 3990 },
          { tipo: "Churrasco", precio: 4490 },
          { tipo: "Mechada", precio: 5290 }
        ];
      } else if (nuevoEsquema === 'variantes') {
        delete p.precio;
        delete p.carnes;
        p.variantes = [
          { tipo: "Normal", precio: 3500 },
          { tipo: "Grande", precio: 4900 }
        ];
      } else {
        delete p.carnes;
        delete p.variantes;
        p.precio = 5000;
      }
      renderAdmin();
    }

    function renderAdmin() {
      const container = document.getElementById('admin-container');
      const busqueda = document.getElementById('search-box').value.toLowerCase().trim();
      container.innerHTML = '';

      let totalCoincidencias = 0;

      menuData.forEach((cat) => {
        if (categoriaActiva !== 'todas' && cat.id !== categoriaActiva) return;

        let prodsHtml = '';
        let productosFiltrados = 0;

        cat.productos.forEach((p) => {
          const coincide = p.nombre.toLowerCase().includes(busqueda) || (p.desc && p.desc.toLowerCase().includes(busqueda));
          if (!coincide) return;

          productosFiltrados++;
          totalCoincidencias++;

          let extraHtml = '';
          const esquemaActual = p.carnes ? 'carnes' : (p.variantes ? 'variantes' : 'fijo');

          if (p.variantes) {
            extraHtml = `
              <div class="variant-box">
                <div class="variant-head">
                  <span class="variant-title">📏 Tamaños / Porciones Multiprecio</span>
                  <button class="btn-sub" onclick="agregarVariante(${p.id})">+ Añadir Tamaño</button>
                </div>
                ${p.variantes.map((v, vIdx) => `
                  <div class="variant-row">
                    <input type="text" class="input-clean" value="${v.tipo}" placeholder="Ej: Mediana, 1 Kilo..." oninput="actualizarVarianteTipo(${p.id}, ${vIdx}, this.value)">
                    <div class="price-input-wrap">
                      <span>$</span>
                      <input type="number" value="${v.precio}" oninput="actualizarVariantePrecio(${p.id}, ${vIdx}, this.value)">
                    </div>
                    <button class="btn-sub btn-del" onclick="eliminarVariante(${p.id}, ${vIdx})">✕</button>
                  </div>
                `).join('')}
              </div>
            `;
          } else if (p.carnes) {
            extraHtml = `
              <div class="variant-box">
                <div class="variant-head">
                  <span class="variant-title">🥩 Multiprecio por Proteína</span>
                </div>
                ${p.carnes.map((c, carIdx) => `
                  <div class="variant-row" style="grid-template-columns: 1fr 115px;">
                    <input type="text" class="input-clean" value="${c.tipo}" disabled style="opacity:0.75; font-weight:600;">
                    <div class="price-input-wrap">
                      <span>$</span>
                      <input type="number" value="${c.precio}" oninput="actualizarCarne(${p.id}, ${carIdx}, this.value)">
                    </div>
                  </div>
                `).join('')}
              </div>
            `;
          }

          prodsHtml += `
            <div class="prod-card">
              <div class="grid-header">
                <input type="text" class="input-clean" style="font-weight:700;" value="${p.nombre}" placeholder="Nombre del producto" oninput="actualizarNombre(${p.id}, this.value)">
                ${p.precio !== undefined ? `
                  <div class="price-input-wrap">
                    <span>$</span>
                    <input type="number" value="${p.precio}" oninput="actualizarPrecio(${p.id}, this.value)">
                  </div>
                ` : '<div style="font-size:0.75rem; color:var(--accent-orange); font-weight:700;">(Multiprecio Activo)</div>'}
              </div>

              <textarea class="input-clean" style="resize:vertical; height:45px;" placeholder="Ingredientes / descripción..." oninput="actualizarDesc(${p.id}, this.value)">${p.desc || ''}</textarea>
              
              <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
                <input type="text" class="input-clean" style="font-size:0.75rem; max-width:280px;" value="${p.img || ''}" placeholder="Ruta foto (ej: img/producto.jpeg)" oninput="actualizarImg(${p.id}, this.value)">
                
                <div class="type-switcher">
                  <span>Esquema:</span>
                  <select onchange="cambiarEsquemaPrecio(${p.id}, this.value)">
                    <option value="fijo" ${esquemaActual === 'fijo' ? 'selected' : ''}>Precio Único</option>
                    <option value="variantes" ${esquemaActual === 'variantes' ? 'selected' : ''}>Tamaños (Normal/Grande)</option>
                    <option value="carnes" ${esquemaActual === 'carnes' ? 'selected' : ''}>Proteínas (Lomito/Churrasco/Mechada)</option>
                  </select>
                  <button class="btn-sub btn-del" style="width:auto; padding:5px 12px;" onclick="eliminarProducto(${p.id})">Eliminar</button>
                </div>
              </div>

              ${extraHtml}
            </div>
          `;
        });

        if (productosFiltrados > 0 || busqueda === '') {
          container.innerHTML += `
            <div class="cat-block">
              <div class="cat-header">
                <div class="cat-label">
                  <span>${cat.icono}</span>
                  <span>${cat.categoria}</span>
                </div>
                <div class="cat-badge">${cat.productos.length} ítems</div>
              </div>
              ${prodsHtml}
              <div style="padding: 12px 18px 16px;">
                <button class="btn-add-prod" onclick="crearProductoInteligente('${cat.id}')">
                  + Crear Nuevo Ítem en ${cat.categoria}
                </button>
              </div>
            </div>
          `;
        }
      });

      if (totalCoincidencias === 0 && busqueda !== '') {
        container.innerHTML = `<div style="text-align:center; padding: 40px; color:var(--muted);">No se encontraron productos para "${busqueda}".</div>`;
      }
    }

    // Creador inteligente según el tipo de categoría
    function crearProductoInteligente(catId) {
      const cat = menuData.find(c => c.id === catId);
      if (!cat) return;

      const nuevoId = Date.now();
      let nuevoProd = {
        id: nuevoId,
        nombre: "Nuevo Ítem",
        desc: "Descripción de ingredientes...",
        img: ""
      };

      if (catId === 'sandwiches') {
        // Matriz de 3 carnes
        nuevoProd.carnes = [
          { tipo: "Lomito", precio: 3990 },
          { tipo: "Churrasco", precio: 4490 },
          { tipo: "Mechada", precio: 5290 }
        ];
      } else if (catId === 'vienesas' || catId === 'as') {
        // Tamaños Normal y Grande
        nuevoProd.variantes = [
          { tipo: "Normal", precio: 2990 },
          { tipo: "Grande", precio: 3990 }
        ];
      } else if (catId === 'papas') {
        // Formatos de papas
        nuevoProd.variantes = [
          { tipo: "Mediana", precio: 4990 },
          { tipo: "L", precio: 6490 }
        ];
      } else {
        // Precio único para smash, bebidas, promos, etc.
        nuevoProd.precio = 6990;
      }

      cat.productos.push(nuevoProd);
      renderAdmin();

      // Scroll automático al nuevo producto
      setTimeout(() => {
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      }, 100);
    }

    function agregarVariante(prodId) {
      const p = obtenerProducto(prodId);
      if (p) {
        if (!p.variantes) p.variantes = [];
        p.variantes.push({ tipo: "Nuevo Tamaño", precio: 0 });
        renderAdmin();
      }
    }

    function eliminarVariante(prodId, vIdx) {
      const p = obtenerProducto(prodId);
      if (p && p.variantes) {
        p.variantes.splice(vIdx, 1);
        renderAdmin();
      }
    }

    function eliminarProducto(prodId) {
      const p = obtenerProducto(prodId);
      if (p && confirm(`¿Seguro que deseas eliminar "${p.nombre}"?`)) {
        for (const cat of menuData) {
          const idx = cat.productos.findIndex(item => item.id == prodId);
          if (idx !== -1) {
            cat.productos.splice(idx, 1);
            break;
          }
        }
        renderAdmin();
      }
    }

    async function guardarEnServidor() {
      const btn = document.querySelector('.btn-save');
      const originalText = btn.innerHTML;
      btn.innerHTML = `<span>⏳</span> Publicando...`;
      btn.disabled = true;

      const pinSesion = sessionStorage.getItem('chippys_admin_pin') || '';

      try {
        const res = await fetch('/api/guardar', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            pin: pinSesion,
            menuData: menuData
          })
        });

        const resultado = await res.json();

        if (!res.ok) {
          throw new Error(resultado.error || 'Error en el servidor');
        }

        const toast = document.getElementById('toast-msg');
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
      } catch (e) {
        console.error("Error al publicar:", e);
        alert(`No se pudo publicar el menú:\n${e.message}`);
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    verificarSesion();
  </script>
</body>
</html>
