<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chippys Backoffice - Gestión de Menú</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #0b0c10;
      --bg-surface: #14161d;
      --bg-card: #1c1f2b;
      --bg-input: #0f1118;
      --border-subtle: #292d3e;
      --border-focus: #ffb703;
      --brand-accent: #ffb703;
      --brand-orange: #fb8500;
      --text-main: #f4f6fc;
      --text-muted: #8e95aa;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.12);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg-body); color: var(--text-main); min-height: 100vh; padding-bottom: 90px; }

    /* Login Lockscreen */
    .lock-overlay {
      position: fixed; inset: 0;
      background: rgba(11, 12, 16, 0.94);
      backdrop-filter: blur(14px);
      z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .lock-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 36px 30px;
      width: 100%; max-width: 380px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
    }
    .lock-brand { font-size: 1.5rem; font-weight: 800; color: var(--brand-accent); letter-spacing: 1px; margin-bottom: 6px; }
    .lock-desc { font-size: 0.84rem; color: var(--text-muted); margin-bottom: 22px; }

    /* Inputs y botones */
    .input-field {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-field:focus { outline: none; border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(255, 183, 3, 0.15); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 18px; border-radius: var(--radius-sm);
      font-size: 0.86rem; font-weight: 700;
      border: none; cursor: pointer; transition: all 0.18s ease;
    }
    .btn-primary { background: var(--brand-accent); color: #000; }
    .btn-primary:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn-publish {
      background: linear-gradient(135deg, var(--success) 0%, #16a34a 100%);
      color: #fff;
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.28);
    }
    .btn-publish:hover { opacity: 0.94; transform: translateY(-1px); }
    .btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border-subtle); }
    .btn-ghost:hover { color: var(--text-main); border-color: var(--text-muted); }
    .btn-danger-ghost { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(239,68,68,0.25); }
    .btn-danger-ghost:hover { background: var(--danger); color: #fff; }

    /* Top Navbar */
    header {
      background: rgba(20, 22, 29, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky; top: 0; z-index: 100;
      padding: 14px 24px;
      display: flex; justify-content: space-between; align-items: center; gap: 15px;
    }
    .brand-cluster { display: flex; align-items: center; gap: 12px; }
    .badge-status {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--success-bg); color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 3px 10px; border-radius: 30px; font-size: 0.72rem; font-weight: 700;
    }

    /* Barra de Navegación y Filtros */
    .filter-bar {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 14px 24px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .tabs-wrapper {
      display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    }
    .tabs-wrapper::-webkit-scrollbar { display: none; }
    .nav-tab {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 8px 16px; border-radius: 30px;
      font-size: 0.82rem; font-weight: 600; cursor: pointer; white-space: nowrap;
      transition: all 0.15s ease;
    }
    .nav-tab.active { background: var(--brand-accent); color: #000; border-color: var(--brand-accent); font-weight: 700; }

    /* Contenedor y Grupos de Categorías */
    .main-wrapper { max-width: 960px; margin: 24px auto; padding: 0 18px; }
    .category-group {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      margin-bottom: 24px; overflow: hidden;
    }
    .category-group-header {
      padding: 14px 20px;
      background: rgba(255, 183, 3, 0.04);
      border-bottom: 1px solid var(--border-subtle);
      display: flex; justify-content: space-between; align-items: center;
    }
    .category-group-title { font-size: 1rem; font-weight: 800; color: var(--brand-accent); display: flex; align-items: center; gap: 8px; }
    .category-count { background: var(--bg-card); padding: 2px 8px; border-radius: 12px; font-size: 0.74rem; color: var(--text-muted); }

    /* Tarjetas de Producto */
    .product-row {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex; flex-direction: column; gap: 14px;
      background: var(--bg-surface);
      transition: background-color 0.15s ease;
    }
    .product-row:last-child { border-bottom: none; }
    .product-row:hover { background: rgba(255, 255, 255, 0.015); }

    .prod-main-grid {
      display: grid;
      grid-template-columns: 1fr 150px;
      gap: 12px;
      align-items: center;
    }
    @media (max-width: 640px) {
      .prod-main-grid { grid-template-columns: 1fr; }
    }

    .price-badge-box {
      display: flex; align-items: center; gap: 6px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
    }
    .price-badge-box span { color: var(--brand-accent); font-weight: 800; }
    .price-badge-box input {
      background: transparent; border: none; color: #fff;
      font-weight: 700; width: 100%; outline: none; font-size: 0.95rem;
    }

    /* Cajas Multiprecio */
    .multiprice-wrapper {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 14px;
    }
    .multiprice-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; font-size: 0.74rem; font-weight: 800; color: var(--brand-accent); text-transform: uppercase;
    }
    .variant-line {
      display: grid;
      grid-template-columns: 1fr 130px 36px;
      gap: 8px; margin-bottom: 8px; align-items: center;
    }
    .variant-line:last-child { margin-bottom: 0; }

    /* Acciones inferiores de la fila */
    .prod-footer-row {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 10px; padding-top: 4px;
    }
    .scheme-badge {
      font-size: 0.76rem; color: var(--text-muted); display: inline-flex; align-items: center; gap: 6px;
    }
    .scheme-badge select {
      background: var(--bg-input); border: 1px solid var(--border-subtle);
      color: var(--text-main); padding: 4px 8px; border-radius: 6px; font-size: 0.75rem;
    }

    /* Modal emergente para agregar producto */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      z-index: 800;
      display: none; align-items: center; justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.active { display: flex; }
    .modal-window {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      width: 100%; max-width: 520px;
      padding: 24px;
      display: flex; flex-direction: column; gap: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .modal-window-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-subtle); padding-bottom: 12px; }
    .modal-window-title { font-size: 1.1rem; font-weight: 800; color: var(--brand-accent); }

    /* Toast */
    .toast-pill {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--success); color: #fff;
      padding: 12px 20px; border-radius: 30px;
      font-weight: 700; font-size: 0.88rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: none; z-index: 900;
    }
  </style>
</head>
<body>

  <!-- Modal Acceso Seguro -->
  <div class="lock-overlay" id="lock-screen">
    <div class="lock-card">
      <div class="lock-brand">CHIPPYS</div>
      <p class="lock-desc">Panel Administrativo del Catálogo</p>
      <form id="login-form" onsubmit="handleAuth(event)">
        <input type="password" id="auth-input" class="input-field" placeholder="Ingresa PIN de acceso" maxlength="8" autofocus style="text-align:center; font-size:1.2rem; letter-spacing:4px; margin-bottom:14px;">
        <button type="submit" class="btn btn-primary" style="width:100%;">Desbloquear Panel</button>
      </form>
    </div>
  </div>

  <!-- Header Superior -->
  <header>
    <div class="brand-cluster">
      <span style="font-weight:900; font-size:1.25rem; color:var(--brand-accent); letter-spacing:0.5px;">CHIPPYS ADMIN</span>
      <span class="badge-status">● Sistema Conectado</span>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="btn btn-publish" onclick="persistirDatosServidor()">
        <span>🚀</span> Guardar y Publicar
      </button>
      <button class="btn btn-ghost" onclick="cerrarSesion()">Salir</button>
    </div>
  </header>

  <!-- Filtros -->
  <div class="filter-bar">
    <input type="text" id="quick-search" class="input-field" placeholder="Buscar por nombre o ingredientes..." oninput="filtrarEnPantalla()">
    <div class="tabs-wrapper" id="tabs-container"></div>
  </div>

  <!-- Contenedor Principal -->
  <main class="main-wrapper" id="content-container">
    <div style="text-align:center; padding: 60px; color:var(--text-muted);">Sincronizando carta digital...</div>
  </main>

  <!-- Modal Estable para Crear Ítems -->
  <div class="modal-backdrop" id="create-modal">
    <div class="modal-window">
      <div class="modal-window-header">
        <span class="modal-window-title" id="create-modal-cat-name">Nuevo Ítem</span>
        <button type="button" class="btn btn-ghost" style="padding:4px 8px;" onclick="cerrarModalCreacion()">✕</button>
      </div>

      <input type="hidden" id="new-item-cat-id">

      <div>
        <label style="font-size:0.75rem; color:var(--text-muted); font-weight:700; display:block; margin-bottom:4px;">NOMBRE DEL PRODUCTO</label>
        <input type="text" id="new-item-name" class="input-field" placeholder="Ej: Smash Especial Doble">
      </div>

      <div>
        <label style="font-size:0.75rem; color:var(--text-muted); font-weight:700; display:block; margin-bottom:4px;">DESCRIPCIÓN / INGREDIENTES</label>
        <textarea id="new-item-desc" class="input-field" style="resize:vertical; height:60px;" placeholder="Pan de papa, queso fundido..."></textarea>
      </div>

      <div id="new-item-price-preview">
        <!-- Campos dinámicos según el tipo de categoría -->
      </div>

      <div>
        <label style="font-size:0.75rem; color:var(--text-muted); font-weight:700; display:block; margin-bottom:4px;">RUTA DE IMAGEN (OPCIONAL)</label>
        <input type="text" id="new-item-img" class="input-field" placeholder="img/ejemplo.jpeg">
      </div>

      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:8px;">
        <button type="button" class="btn btn-ghost" onclick="cerrarModalCreacion()">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="guardarNuevoItemDesdeModal()">Añadir al Menú</button>
      </div>
    </div>
  </div>

  <div class="toast-pill" id="sync-toast">✅ Menú publicado correctamente</div>

  <script>
    const ADMIN_PIN = "231721";
    const NPOINT_URL = "https://api.npoint.io/3b2ace171723868f5708";

    let menuData = [];
    let categoriaSeleccionada = "todas";

    // Sesión
    function inicializarSeguridad() {
      const auth = sessionStorage.getItem('chippys_admin_auth') === 'true';
      const pin = sessionStorage.getItem('chippys_admin_pin');

      if (auth && pin === ADMIN_PIN) {
        document.getElementById('lock-screen').style.display = 'none';
        cargarDatosCatalogo();
      } else {
        sessionStorage.clear();
        document.getElementById('lock-screen').style.display = 'flex';
      }
    }

    function handleAuth(e) {
      e.preventDefault();
      const val = document.getElementById('auth-input').value.trim();
      if (val === ADMIN_PIN) {
        sessionStorage.setItem('chippys_admin_auth', 'true');
        sessionStorage.setItem('chippys_admin_pin', val);
        document.getElementById('lock-screen').style.display = 'none';
        cargarDatosCatalogo();
      } else {
        alert("PIN incorrecto");
        document.getElementById('auth-input').value = '';
      }
    }

    function cerrarSesion() {
      sessionStorage.clear();
      location.reload();
    }

    // Carga de Datos
    async function cargarDatosCatalogo() {
      const container = document.getElementById('content-container');
      try {
        const res = await fetch(`${NPOINT_URL}?t=${Date.now()}`);
        if (!res.ok) throw new Error("No se pudo obtener la información");
        menuData = await res.json();
        renderizarPestanas();
        renderizarListaProductos();
      } catch (err) {
        container.innerHTML = `
          <div style="background:var(--danger-bg); border:1px solid var(--danger); padding:20px; border-radius:var(--radius-md); text-align:center;">
            <b>Error de sincronización:</b> No se pudieron obtener los datos de la carta.
          </div>
        `;
      }
    }

    function renderizarPestanas() {
      const tabsBox = document.getElementById('tabs-container');
      tabsBox.innerHTML = `
        <button type="button" class="nav-tab ${categoriaSeleccionada === 'todas' ? 'active' : ''}" onclick="seleccionarCategoria('todas')">
          🌟 Todas las Categorías
        </button>
      `;

      menuData.forEach(cat => {
        tabsBox.innerHTML += `
          <button type="button" class="nav-tab ${categoriaSeleccionada === cat.id ? 'active' : ''}" onclick="seleccionarCategoria('${cat.id}')">
            ${cat.icono} ${cat.categoria}
          </button>
        `;
      });
    }

    function seleccionarCategoria(id) {
      categoriaSeleccionada = id;
      renderizarPestanas();
      renderizarListaProductos();
    }

    function filtrarEnPantalla() {
      renderizarListaProductos();
    }

    // Funciones seguras de mutación por ID
    function buscarProducto(id) {
      for (const cat of menuData) {
        const item = cat.productos.find(p => p.id == id);
        if (item) return item;
      }
      return null;
    }

    function mutarTexto(id, campo, val) {
      const p = buscarProducto(id);
      if (p) p[campo] = val;
    }

    function mutarPrecioUnico(id, val) {
      const p = buscarProducto(id);
      if (p) p.precio = Number(val);
    }

    function mutarVariante(id, vIdx, campo, val) {
      const p = buscarProducto(id);
      if (p && p.variantes && p.variantes[vIdx]) {
        p.variantes[vIdx][campo] = campo === 'precio' ? Number(val) : val;
      }
    }

    function mutarCarne(id, cIdx, val) {
      const p = buscarProducto(id);
      if (p && p.carnes && p.carnes[cIdx]) {
        p.carnes[cIdx].precio = Number(val);
      }
    }

    function cambiarEsquema(id, esquema) {
      const p = buscarProducto(id);
      if (!p) return;

      if (esquema === 'carnes') {
        delete p.precio;
        delete p.variantes;
        p.carnes = [
          { tipo: "Lomito", precio: 3990 },
          { tipo: "Churrasco", precio: 4490 },
          { tipo: "Mechada", precio: 5290 }
        ];
      } else if (esquema === 'variantes') {
        delete p.precio;
        delete p.carnes;
        p.variantes = [
          { tipo: "Normal", precio: 2990 },
          { tipo: "Grande", precio: 3990 }
        ];
      } else {
        delete p.carnes;
        delete p.variantes;
        p.precio = 5000;
      }
      renderizarListaProductos();
    }

    function eliminarItem(id) {
      const p = buscarProducto(id);
      if (p && confirm(`¿Deseas eliminar permanentemente "${p.nombre}"?`)) {
        for (const cat of menuData) {
          const idx = cat.productos.findIndex(item => item.id == id);
          if (idx !== -1) {
            cat.productos.splice(idx, 1);
            break;
          }
        }
        renderizarListaProductos();
      }
    }

    function agregarTamanoVariante(id) {
      const p = buscarProducto(id);
      if (p) {
        if (!p.variantes) p.variantes = [];
        p.variantes.push({ tipo: "1 Kilo", precio: 6990 });
        renderizarListaProductos();
      }
    }

    function borrarTamanoVariante(id, vIdx) {
      const p = buscarProducto(id);
      if (p && p.variantes) {
        p.variantes.splice(vIdx, 1);
        renderizarListaProductos();
      }
    }

    // Render del Catálogo
    function renderizarListaProductos() {
      const container = document.getElementById('content-container');
      const search = document.getElementById('quick-search').value.toLowerCase().trim();
      container.innerHTML = '';

      let totalVisibles = 0;

      menuData.forEach(cat => {
        if (categoriaSeleccionada !== 'todas' && cat.id !== categoriaSeleccionada) return;

        let prodsHtml = '';
        let countCat = 0;

        cat.productos.forEach(p => {
          const match = p.nombre.toLowerCase().includes(search) || (p.desc && p.desc.toLowerCase().includes(search));
          if (!match) return;

          countCat++;
          totalVisibles++;

          let multiprecioHtml = '';
          const esquema = p.carnes ? 'carnes' : (p.variantes ? 'variantes' : 'fijo');

          if (p.variantes) {
            multiprecioHtml = `
              <div class="multiprice-wrapper">
                <div class="multiprice-header">
                  <span>Porciones / Tamaños Multiprecio</span>
                  <button type="button" class="btn btn-ghost" style="padding:4px 8px; font-size:0.75rem;" onclick="agregarTamanoVariante(${p.id})">+ Agregar Formato</button>
                </div>
                ${p.variantes.map((v, vIdx) => `
                  <div class="variant-line">
                    <input type="text" class="input-field" value="${v.tipo}" placeholder="Nombre tamaño" oninput="mutarVariante(${p.id}, ${vIdx}, 'tipo', this.value)">
                    <div class="price-badge-box">
                      <span>$</span>
                      <input type="number" value="${v.precio}" oninput="mutarVariante(${p.id}, ${vIdx}, 'precio', this.value)">
                    </div>
                    <button type="button" class="btn btn-danger-ghost" style="padding:0; height:36px;" onclick="borrarTamanoVariante(${p.id}, ${vIdx})">✕</button>
                  </div>
                `).join('')}
              </div>
            `;
          } else if (p.carnes) {
            multiprecioHtml = `
              <div class="multiprice-wrapper">
                <div class="multiprice-header">
                  <span>Precios por Tipo de Carne</span>
                </div>
                ${p.carnes.map((c, carIdx) => `
                  <div class="variant-line" style="grid-template-columns: 1fr 140px;">
                    <input type="text" class="input-field" value="${c.tipo}" disabled style="opacity:0.6; font-weight:700;">
                    <div class="price-badge-box">
                      <span>$</span>
                      <input type="number" value="${c.precio}" oninput="mutarCarne(${p.id}, ${carIdx}, this.value)">
                    </div>
                  </div>
                `).join('')}
              </div>
            `;
          }

          prodsHtml += `
            <div class="product-row">
              <div class="prod-main-grid">
                <input type="text" class="input-field" style="font-weight:700;" value="${p.nombre}" placeholder="Nombre del producto" oninput="mutarTexto(${p.id}, 'nombre', this.value)">
                ${p.precio !== undefined ? `
                  <div class="price-badge-box">
                    <span>$</span>
                    <input type="number" value="${p.precio}" oninput="mutarPrecioUnico(${p.id}, this.value)">
                  </div>
                ` : `<div style="font-size:0.8rem; font-weight:700; color:var(--brand-orange); text-align:right;">(Multiprecio Activo)</div>`}
              </div>

              <textarea class="input-field" style="resize:vertical; height:45px;" placeholder="Descripción e ingredientes..." oninput="mutarTexto(${p.id}, 'desc', this.value)">${p.desc || ''}</textarea>

              <div class="prod-footer-row">
                <input type="text" class="input-field" style="max-width:300px; font-size:0.78rem;" value="${p.img || ''}" placeholder="Ruta imagen: img/foto.jpeg" oninput="mutarTexto(${p.id}, 'img', this.value)">
                
                <div style="display:flex; align-items:center; gap:8px;">
                  <div class="scheme-badge">
                    <span>Tipo:</span>
                    <select onchange="cambiarEsquema(${p.id}, this.value)">
                      <option value="fijo" ${esquema === 'fijo' ? 'selected' : ''}>Precio Único</option>
                      <option value="variantes" ${esquema === 'variantes' ? 'selected' : ''}>Porciones/Tamaños</option>
                      <option value="carnes" ${esquema === 'carnes' ? 'selected' : ''}>Matriz de Carnes</option>
                    </select>
                  </div>
                  <button type="button" class="btn btn-danger-ghost" style="padding:6px 12px;" onclick="eliminarItem(${p.id})">Eliminar</button>
                </div>
              </div>

              ${multiprecioHtml}
            </div>
          `;
        });

        if (countCat > 0 || search === '') {
          container.innerHTML += `
            <section class="category-group">
              <div class="category-group-header">
                <div class="category-group-title">
                  <span>${cat.icono}</span>
                  <span>${cat.categoria}</span>
                </div>
                <span class="category-count">${cat.productos.length} ítems</span>
              </div>
              <div>${prodsHtml}</div>
              <div style="padding: 14px 20px; background: rgba(0,0,0,0.15);">
                <button type="button" class="btn btn-ghost" style="width:100%; border-style:dashed; border-color:var(--brand-accent); color:var(--brand-accent);" onclick="abrirModalCreacion('${cat.id}')">
                  + Crear Nuevo Producto en ${cat.categoria}
                </button>
              </div>
            </section>
          `;
        }
      });

      if (totalVisibles === 0 && search !== '') {
        container.innerHTML = `<div style="text-align:center; padding: 50px; color:var(--text-muted);">No se encontraron productos coincidentes.</div>`;
      }
    }

    // Modal Controlado de Creación
    function abrirModalCreacion(catId) {
      const cat = menuData.find(c => c.id === catId);
      if (!cat) return;

      document.getElementById('new-item-cat-id').value = catId;
      document.getElementById('create-modal-cat-name').innerText = `Nuevo Producto en ${cat.categoria}`;
      document.getElementById('new-item-name').value = '';
      document.getElementById('new-item-desc').value = '';
      document.getElementById('new-item-img').value = '';

      const previewBox = document.getElementById('new-item-price-preview');

      if (catId === 'sandwiches') {
        previewBox.innerHTML = `
          <label style="font-size:0.75rem; color:var(--text-muted); font-weight:700; display:block; margin-bottom:4px;">PRECIOS POR CARNE</label>
          <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;">
            <input type="number" id="new-p-lomito" class="input-field" placeholder="Lomito $" value="3990">
            <input type="number" id="new-p-churrasco" class="input-field" placeholder="Churrasco $" value="4490">
            <input type="number" id="new-p-mechada" class="input-field" placeholder="Mechada $" value="5290">
          </div>
        `;
      } else if (catId === 'vienesas' || catId === 'as') {
        previewBox.innerHTML = `
          <label style="font-size:0.75rem; color:var(--text-muted); font-weight:700; display:block; margin-bottom:4px;">PRECIOS POR FORMATO</label>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
            <input type="number" id="new-p-normal" class="input-field" placeholder="Normal $" value="2990">
            <input type="number" id="new-p-grande" class="input-field" placeholder="Grande $" value="3990">
          </div>
        `;
      } else if (catId === 'papas') {
        previewBox.innerHTML = `
          <label style="font-size:0.75rem; color:var(--text-muted); font-weight:700; display:block; margin-bottom:4px;">PRECIOS POR FORMATO</label>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
            <input type="number" id="new-p-mediana" class="input-field" placeholder="Mediana $" value="4990">
            <input type="number" id="new-p-l" class="input-field" placeholder="L $" value="6490">
          </div>
        `;
      } else {
        previewBox.innerHTML = `
          <label style="font-size:0.75rem; color:var(--text-muted); font-weight:700; display:block; margin-bottom:4px;">PRECIO ($)</label>
          <input type="number" id="new-p-fijo" class="input-field" placeholder="Ej: 6990" value="6990">
        `;
      }

      document.getElementById('create-modal').classList.add('active');
    }

    function cerrarModalCreacion() {
      document.getElementById('create-modal').classList.remove('active');
    }

    function guardarNuevoItemDesdeModal() {
      const catId = document.getElementById('new-item-cat-id').value;
      const cat = menuData.find(c => c.id === catId);
      if (!cat) return;

      const nombre = document.getElementById('new-item-name').value.trim() || 'Nuevo Producto';
      const desc = document.getElementById('new-item-desc').value.trim();
      const img = document.getElementById('new-item-img').value.trim();

      let nuevoItem = {
        id: Date.now(),
        nombre: nombre,
        desc: desc,
        img: img
      };

      if (catId === 'sandwiches') {
        nuevoItem.carnes = [
          { tipo: "Lomito", precio: Number(document.getElementById('new-p-lomito').value) || 3990 },
          { tipo: "Churrasco", precio: Number(document.getElementById('new-p-churrasco').value) || 4490 },
          { tipo: "Mechada", precio: Number(document.getElementById('new-p-mechada').value) || 5290 }
        ];
      } else if (catId === 'vienesas' || catId === 'as') {
        nuevoItem.variantes = [
          { tipo: "Normal", precio: Number(document.getElementById('new-p-normal').value) || 2990 },
          { tipo: "Grande", precio: Number(document.getElementById('new-p-grande').value) || 3990 }
        ];
      } else if (catId === 'papas') {
        nuevoItem.variantes = [
          { tipo: "Mediana", precio: Number(document.getElementById('new-p-mediana').value) || 4990 },
          { tipo: "L", precio: Number(document.getElementById('new-p-l').value) || 6490 }
        ];
      } else {
        nuevoItem.precio = Number(document.getElementById('new-p-fijo').value) || 6990;
      }

      cat.productos.push(nuevoItem);
      cerrarModalCreacion();
      renderizarListaProductos();
    }

    // Persistencia con Vercel API
    async function persistirDatosServidor() {
      const btn = document.querySelector('.btn-publish');
      const originalText = btn.innerHTML;
      btn.innerHTML = `<span>⏳</span> Guardando...`;
      btn.disabled = true;

      const pin = sessionStorage.getItem('chippys_admin_pin') || '';

      try {
        const res = await fetch('/api/guardar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: pin, menuData: menuData })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error al persistir');

        const toast = document.getElementById('sync-toast');
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
      } catch (err) {
        alert(`No se pudo publicar el catálogo:\n${err.message}`);
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    inicializarSeguridad();
  </script>
</body>
</html>
