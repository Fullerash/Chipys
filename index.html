<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chippys - Menú Digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #121316;
      --bg-card: #1c1d22;
      --bg-card-alt: #25262c;
      --accent-yellow: #ffb703;
      --accent-orange: #fb8500;
      --accent-red: #e63946;
      --text-white: #f8f9fa;
      --text-muted: #a0a4b0;
      --text-dim: #6c727f;
      --border-color: #2e3039;
      --whatsapp-green: #25d366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-white);
      padding-bottom: 120px;
    }

    /* Header */
    header {
      background: linear-gradient(180deg, rgba(251,133,0,0.15) 0%, rgba(18,19,22,0) 100%), var(--bg-main);
      padding: 30px 20px 20px;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
    }
    .brand-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 2.4rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-yellow);
      text-shadow: 0 2px 10px rgba(255, 183, 3, 0.3);
      margin-bottom: 4px;
    }
    .brand-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: 1px;
    }

    /* Categorías Stickys */
    .nav-categories {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(18, 19, 22, 0.95);
      backdrop-filter: blur(10px);
      padding: 12px 15px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      white-space: nowrap;
      border-bottom: 1px solid var(--border-color);
      scrollbar-width: none;
    }
    .nav-categories::-webkit-scrollbar { display: none; }
    
    .cat-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .cat-btn.active, .cat-btn:hover {
      background: var(--accent-yellow);
      color: #000;
      border-color: var(--accent-yellow);
    }

    /* Contenedor */
    .container {
      max-width: 650px;
      margin: 0 auto;
      padding: 20px 15px;
    }

    .category-section {
      margin-bottom: 35px;
      scroll-margin-top: 70px;
    }
    .category-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.3rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--accent-yellow);
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .category-title::after {
      content: '';
      flex: 1;
      height: 2px;
      background: var(--border-color);
    }

    /* Card Producto */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      transition: transform 0.15s ease, border-color 0.2s;
    }
    .card:active {
      transform: scale(0.99);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }
    .card-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-white);
      text-transform: uppercase;
    }
    .card-price {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      color: var(--accent-yellow);
      font-size: 1.05rem;
      white-space: nowrap;
    }
    .card-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 12px;
    }

    /* Selectores de Variantes */
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
      background: var(--bg-card-alt);
      padding: 10px;
      border-radius: 8px;
    }
    .options-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-orange);
      text-transform: uppercase;
    }
    .options-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .opt-chip {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.78rem;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .opt-chip.selected {
      background: rgba(255, 183, 3, 0.2);
      border-color: var(--accent-yellow);
      color: var(--accent-yellow);
      font-weight: 600;
    }

    /* Checkbox de Combo */
    .combo-box {
      background: rgba(251, 133, 0, 0.1);
      border: 1px dashed var(--accent-orange);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }
    .combo-box input {
      accent-color: var(--accent-orange);
      transform: scale(1.2);
      cursor: pointer;
    }
    .combo-text {
      display: flex;
      flex-direction: column;
    }
    .combo-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-white);
    }
    .combo-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* Botón Agregar */
    .btn-add {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-yellow) 0%, var(--accent-orange) 100%);
      color: #000;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.2s;
    }
    .btn-add:active {
      opacity: 0.85;
    }

    /* Barra Flotante Carrito */
    .cart-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 30px);
      max-width: 600px;
      background: rgba(28, 29, 34, 0.95);
      border: 1px solid var(--accent-yellow);
      backdrop-filter: blur(12px);
      padding: 12px 18px;
      border-radius: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      z-index: 100;
    }
    .cart-info {
      display: flex;
      flex-direction: column;
    }
    .cart-count {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }
    .cart-total {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-white);
    }
    .btn-cart-view {
      background: var(--whatsapp-green);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Modal Carrito */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-content {
      background: var(--bg-card);
      border-top: 2px solid var(--accent-yellow);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 650px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow: hidden;
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }
    .modal-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 1.2rem;
      color: var(--accent-yellow);
    }
    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }
    .cart-items-list {
      overflow-y: auto;
      flex: 1;
      margin-bottom: 15px;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
    }
    .cart-item-name {
      font-size: 0.9rem;
      font-weight: 600;
    }
    .cart-item-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .cart-item-qty {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-qty {
      background: var(--bg-card-alt);
      color: var(--text-white);
      border: 1px solid var(--border-color);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .input-field {
      width: 100%;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      color: var(--text-white);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 0.85rem;
    }
    .input-field:focus {
      outline: none;
      border-color: var(--accent-yellow);
    }

    /* Selector de Tipo de Pedido y Método de Pago */
    .delivery-type-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .payment-type-selector {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .type-btn {
      background: var(--bg-card-alt);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .type-btn.active {
      background: rgba(255, 183, 3, 0.15);
      border-color: var(--accent-yellow);
      color: var(--accent-yellow);
    }

    /* Resumen de total */
    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-white);
      margin: 10px 0 15px;
      border-top: 1px solid var(--border-color);
      padding-top: 10px;
    }
  </style>
</head>

  </div>

          ¿Cómo deseas recibir tu pedido?
        </label>
        <div class="delivery-type-selector">
          <button class="type-btn active" id="btn-delivery" onclick="setOrderType('delivery')">
            🛵 Delivery
          </button>
          <button class="type-btn" id="btn-retiro" onclick="setOrderType('retiro')">
            🏬 Retiro en Local
          </button>
        </div>
      </div>

      <!-- Selector de Método de Pago para Delivery -->
      <div id="payment-section" style="margin-top: 5px;">
        <label style="font-size: 0.75rem; font-weight: 600; color: var(--accent-orange); text-transform: uppercase; margin-bottom: 6px; display: block;">
          Método de Pago
        </label>
        <div class="payment-type-selector">
          <button class="type-btn active" id="btn-pay-transfer" onclick="setPaymentMethod('Transferencia')">
            Transferencia
          </button>
          <button class="type-btn" id="btn-pay-cash" onclick="setPaymentMethod('Efectivo')">
            Efectivo
          </button>
          <button class="type-btn" id="btn-pay-card" onclick="setPaymentMethod('Tarjeta')">
            Tarjeta
          </button>
        </div>
      </div>

      <!-- Datos del Cliente -->
      <div>
        <input type="text" id="cust-name" class="input-field" placeholder="Tu Nombre">
        <input type="text" id="cust-address" class="input-field" placeholder="Dirección exacta (calle, número y referencia)">
      </div>

      <!-- Resumen Total Simple -->

          { id: 44, nombre: "Salchipapas", desc: "Papas fritas con vienesa en rodajas.", variantes: [{ tipo: "Mediana", precio: 3990 }, { tipo: "Para Compartir", precio: 5990 }] },
          { id: 45, nombre: "Papas Funghi", desc: "Queso derretido, champiñones salteados y ciboulette.", variantes: [{ tipo: "Mediana", precio: 4990 }, { tipo: "Para Compartir", precio: 6400 }] }
        ]
      },
      {
        id: "compartir",
        categoria: "Para Compartir & Promos",
        icono: "🍗",
        productos: [
          { id: 50, nombre: "Chippy-Promo", desc: "Porción para compartir: 6 Nuggets + 6 Empanadas + 6 Aros de cebolla + 1 Porción de Papas fritas.", precio: 6990 },
          { id: 51, nombre: "Porción de Nuggets", desc: "6 unidades crujientes.", precio: 2690 },
          { id: 52, nombre: "Porción Empanadas de Queso", desc: "6 unidades.", precio: 2690 },
          { id: 53, nombre: "Aros de Cebolla", desc: "6 unidades.", precio: 2590 }
        ]
      },
      {
        id: "bebestibles",
        categoria: "Bebestibles",
        icono: "🥤",
        productos: [
          { id: 60, nombre: "Bebida Express", desc: "Formato individual pequeño.", precio: 800 },
          { id: 61, nombre: "Bebida en Lata", desc: "350ml fría.", precio: 1100 },
          { id: 62, nombre: "Bebida 1.5 Litros", desc: "Ideal para compartir.", precio: 2300 },
          { id: 63, nombre: "Bebida 3 Litros", desc: "Formato familiar.", precio: 3500 },
          { id: 64, nombre: "Jugo Individual", desc: "Botella individual.", precio: 1490 }
        ]
      },
      {
        id: "pasteleria",
        categoria: "Pastelería",
        icono: "🧁",
        productos: [
          { id: 70, nombre: "Muffin", desc: "1 por $1.700 o 2 por $3.000.", precio: 1700 },
          { id: 71, nombre: "Galletas", desc: "1 por $1.000 o 3 por $2.500.", precio: 1000 },
          { id: 72, nombre: "Media Luna", desc: "1 por $1.000 o 3 por $2.500.", precio: 1000 }
        ]
      }
    ];

    let carrito = [];
    const seleccionOpciones = {};
    const seleccionCombos = {};

    function renderMenu() {
      const container = document.getElementById('menu-container');
      container.innerHTML = '';

      menuData.forEach(cat => {
        let catHtml = `
          <section class="category-section" id="${cat.id}">
            <div class="category-title">${cat.icono} ${cat.categoria}</div>
        `;

        cat.productos.forEach(p => {
          let opcionesHtml = '';
          let precioBase = p.precio || 0;

          if (p.variantes) {
            precioBase = p.variantes[0].precio;
            opcionesHtml = `
              <div class="options-container">
                <span class="options-label">Tamaño / Porción:</span>
                <div class="options-grid">
                  ${p.variantes.map((v, i) => `
                    <button class="opt-chip ${i === 0 ? 'selected' : ''}" 
                            onclick="setVariant(${p.id}, '${v.tipo}', ${v.precio}, this)">
                      ${v.tipo} ($${v.precio.toLocaleString('es-CL')})
                    </button>
                  `).join('')}
                </div>
              </div>
            `;
            if (!seleccionOpciones[p.id]) {
              seleccionOpciones[p.id] = { tipo: p.variantes[0].tipo, precio: p.variantes[0].precio };
            }
          } else if (p.carnes) {
            precioBase = p.carnes[0].precio;
            opcionesHtml = `
              <div class="options-container">
                <span class="options-label">Elige tu Carne:</span>
                <div class="options-grid">
                  ${p.carnes.map((c, i) => `
                    <button class="opt-chip ${i === 0 ? 'selected' : ''}" 
                            onclick="setVariant(${p.id}, '${c.tipo}', ${c.precio}, this)">
                      ${c.tipo} ($${c.precio.toLocaleString('es-CL')})
                    </button>
                  `).join('')}
                </div>
              </div>
            `;
            if (!seleccionOpciones[p.id]) {
              seleccionOpciones[p.id] = { tipo: p.carnes[0].tipo, precio: p.carnes[0].precio };
            }
          } else {
            if (!seleccionOpciones[p.id]) {
              seleccionOpciones[p.id] = { tipo: '', precio: p.precio };
            }
          }

          let comboHtml = '';
          if (cat.permiteCombo) {
            comboHtml = `
              <label class="combo-box" for="combo-${p.id}">
                <div class="combo-text">
                  <span class="combo-title">🍟🥤 Combo (+ $2.700)</span>
                  <span class="combo-sub">Suma Papas Fritas + Bebida en lata</span>
                </div>
                <input type="checkbox" id="combo-${p.id}" onchange="toggleCombo(${p.id})">
              </label>
            `;
          }

          catHtml += `
            <div class="card">
              <div class="card-header">
                <div class="card-title">${p.nombre}</div>
                <div class="card-price" id="price-tag-${p.id}">$${precioBase.toLocaleString('es-CL')}</div>
              </div>
              <div class="card-desc">${p.desc}</div>
              ${opcionesHtml}
              ${comboHtml}
              <button class="btn-add" onclick="agregarAlCarrito(${p.id})">+ Agregar al pedido</button>
            </div>
          `;
        });

        catHtml += `</section>`;
        container.innerHTML += catHtml;
      });
    }

    function setVariant(prodId, tipo, precio, btnEl) {
      seleccionOpciones[prodId] = { tipo, precio };
      const chips = btnEl.parentElement.querySelectorAll('.opt-chip');
      chips.forEach(c => c.classList.remove('selected'));
      btnEl.classList.add('selected');
      actualizarPrecioCard(prodId);
    }

    function toggleCombo(prodId) {
      const checkbox = document.getElementById(`combo-${prodId}`);
      seleccionCombos[prodId] = checkbox.checked;
      actualizarPrecioCard(prodId);
    }

    function actualizarPrecioCard(prodId) {
      const opt = seleccionOpciones[prodId];
      let totalCard = opt ? opt.precio : 0;
      if (seleccionCombos[prodId]) {
        totalCard += PRECIO_COMBO;
      }
      document.getElementById(`price-tag-${prodId}`).innerText = `$${totalCard.toLocaleString('es-CL')}`;
    }

    function agregarAlCarrito(prodId) {
      let prodObj = null;
      for (const cat of menuData) {
        const found = cat.productos.find(p => p.id === prodId);
        if (found) { prodObj = found; break; }
      }
      if (!prodObj) return;

      const opt = seleccionOpciones[prodId];
      const tieneCombo = seleccionCombos[prodId] || false;

      let key = `${prodId}`;
      let tituloItem = prodObj.nombre;
      let precioFinal = prodObj.precio || opt.precio;

      if (prodObj.variantes || prodObj.carnes) {
        key += `_${opt.tipo}`;
        tituloItem += ` (${opt.tipo})`;
        precioFinal = opt.precio;
      }

      if (tieneCombo) {
        key += `_combo`;
        tituloItem += ` + Combo (Papas y Bebida en lata)`;
        precioFinal += PRECIO_COMBO;
      }

      const index = carrito.findIndex(item => item.key === key);
      if (index > -1) {
        carrito[index].qty++;
      } else {
        carrito.push({
          key: key,
          id: prodId,
          nombre: tituloItem,
          precio: precioFinal,
          qty: 1
        });
      }

      // Desmarcar combo tras agregar
      const comboCheck = document.getElementById(`combo-${prodId}`);
      if (comboCheck) {
        comboCheck.checked = false;
        seleccionCombos[prodId] = false;
        actualizarPrecioCard(prodId);
      }

      actualizarUI();
    }

    function cambiarCantidad(key, delta) {
      const idx = carrito.findIndex(i => i.key === key);
      if (idx > -1) {
        carrito[idx].qty += delta;
        if (carrito[idx].qty <= 0) carrito.splice(idx, 1);
      }
      actualizarUI();
    }

    function setOrderType(tipo) {
      tipoEntrega = tipo;
      document.getElementById('btn-delivery').classList.toggle('active', tipo === 'delivery');
      document.getElementById('btn-retiro').classList.toggle('active', tipo === 'retiro');
      
      const addrInput = document.getElementById('cust-address');
      const paymentSection = document.getElementById('payment-section');

      if (tipo === 'retiro') {
        addrInput.style.display = "none";
        paymentSection.style.display = "none";
      } else {
        addrInput.style.display = "block";
        paymentSection.style.display = "block";
      }
    }

    function setPaymentMethod(metodo) {
      metodoPago = metodo;
      document.getElementById('btn-pay-transfer').classList.toggle('active', metodo === 'Transferencia');
      document.getElementById('btn-pay-cash').classList.toggle('active', metodo === 'Efectivo');
      document.getElementById('btn-pay-card').classList.toggle('active', metodo === 'Tarjeta');
    }

    function actualizarUI() {
      let total = 0;
      let totalItems = 0;

      const cartList = document.getElementById('cart-list');
      cartList.innerHTML = '';

      if (carrito.length === 0) {
        cartList.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 20px 0;">Tu pedido está vacío 🍔</p>`;
      }

      carrito.forEach(item => {
        const itemSub = item.precio * item.qty;
        total += itemSub;
        totalItems += item.qty;

        cartList.innerHTML += `
          <div class="cart-item">
            <div>
              <div class="cart-item-name">${item.nombre}</div>
              <div class="cart-item-sub">$${item.precio.toLocaleString('es-CL')} c/u</div>
            </div>
            <div class="cart-item-qty">
              <button class="btn-qty" onclick="cambiarCantidad('${item.key}', -1)">-</button>
              <span style="font-weight: 700;">${item.qty}</span>
              <button class="btn-qty" onclick="cambiarCantidad('${item.key}', 1)">+</button>
            </div>
          </div>
        `;
      });

      document.getElementById('bar-count').innerText = `${totalItems} ítem${totalItems !== 1 ? 's' : ''}`;
      document.getElementById('bar-total').innerText = `$${total.toLocaleString('es-CL')}`;
      document.getElementById('modal-total').innerText = `$${total.toLocaleString('es-CL')}`;
    }

    function toggleModal(show) {
      const modal = document.getElementById('cart-modal');
      modal.classList.toggle('open', show);
    }

    function scrollToCategory(id) {
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    }

    function enviarPedidoWhatsApp() {
      if (carrito.length === 0) {
        alert("Agrega algún producto primero.");
        return;
      }
      const nombre = document.getElementById('cust-name').value.trim() || 'Cliente';
      let direccion = document.getElementById('cust-address').value.trim();

      if (tipoEntrega === 'delivery' && !direccion) {
        alert("Por favor ingresa tu dirección para el delivery.");
        return;
      }

      if (tipoEntrega === 'retiro' && !direccion) {
        direccion = "Retiro en local";
      }

      let total = 0;
      let texto = `*¡HOLA CHIPPYS! QUIERO HACER UN PEDIDO* 🍔🔥\n\n`;
      texto += `👤 *Cliente:* ${nombre}\n`;
      texto += `🛵 *Modalidad:* ${tipoEntrega === 'delivery' ? 'DELIVERY' : 'RETIRO EN LOCAL'}\n`;
      if (tipoEntrega === 'delivery') {
        texto += `💳 *Método de Pago:* ${metodoPago}\n`;
        texto += `📍 *Dirección:* ${direccion}\n\n`;
      } else {
        texto += `\n`;
      }
      texto += `📝 *DETALLE DEL PEDIDO:* \n`;

      carrito.forEach(i => {
        const sub = i.precio * i.qty;
        total += sub;
        texto += `• ${i.qty}x ${i.nombre} - $${sub.toLocaleString('es-CL')}\n`;
      });

      texto += `\n💰 *TOTAL:* $${total.toLocaleString('es-CL')}`;

      const url = `https://wa.me/${TELEFONO_WHATSAPP}?text=${encodeURIComponent(texto)}`;
      window.open(url, '_blank');
    }

    // Inicializar
    renderMenu();
    actualizarUI();
  </script>
</body>
</html>
